<!doctype html><meta charset=utf-8><title>InstancedMesh2 vs InstancedMesh, 3000 parked cars</title>
<style>html,body{margin:0;background:#8fb0c8}#loader{display:none}</style>
<div id=loader hidden></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/","bvh.js":"https://cdn.jsdelivr.net/npm/bvh.js@0.0.13/build/index.js","@three.ez/instanced-mesh":"https://cdn.jsdelivr.net/npm/@three.ez/instanced-mesh@0.3.16/build/index.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {InstancedMesh2} from '@three.ez/instanced-mesh';
const MODE=window.MODE||'im2',N=3000;
const R=new THREE.WebGLRenderer({antialias:true});R.setSize(1280,720);document.body.appendChild(R.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8fb0c8);scene.fog=new THREE.Fog(0x8fb0c8,150,520);
scene.add(new THREE.HemisphereLight(0xffffff,0x556655,1.1));const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(60,100,40);scene.add(sun);
const cam=new THREE.PerspectiveCamera(60,1280/720,.5,560);cam.position.set(0,2.2,-300);cam.lookAt(0,2,0);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:0x5f7246}));scene.add(ground);
// car shapes: detailed (body + cabin + 4 octagonal wheels + trim) and the game's cheap far silhouette
function box(w,h,d,x,y,z,c){const g=new THREE.BoxGeometry(w,h,d,2,2,2).translate(x,y,z).toNonIndexed();col(g,c);return g;}
function col(g,c){const n=g.attributes.position.count,a=new Float32Array(n*3);for(let i=0;i<n;i++){a[i*3]=c[0];a[i*3+1]=c[1];a[i*3+2]=c[2];}g.setAttribute('color',new THREE.BufferAttribute(a,3));}
function merge(gs){let n=0;for(const g of gs)n+=g.attributes.position.count;const p=new Float32Array(n*3),q=new Float32Array(n*3),c=new Float32Array(n*3);let o=0;
  for(const g of gs){p.set(g.attributes.position.array,o*3);q.set(g.attributes.normal.array,o*3);c.set(g.attributes.color.array,o*3);o+=g.attributes.position.count;}
  const r=new THREE.BufferGeometry();r.setAttribute('position',new THREE.BufferAttribute(p,3));r.setAttribute('normal',new THREE.BufferAttribute(q,3));r.setAttribute('color',new THREE.BufferAttribute(c,3));return r;}
function wheel(x,z){const g=new THREE.CylinderGeometry(.32,.32,.22,12).rotateZ(Math.PI/2).translate(x,.32,z).toNonIndexed();col(g,[.05,.05,.05]);return g;}
const hi=merge([box(1.8,.7,4.4,0,.65,0,[1,1,1]),box(1.5,.6,2.2,0,1.25,-.2,[.16,.18,.2]),wheel(-.8,1.3),wheel(.8,1.3),wheel(-.8,-1.3),wheel(.8,-1.3)]);
const lo=merge([box(1.8,.7,4.4,0,.65,0,[1,1,1]),box(1.5,.6,2.2,0,1.25,-.2,[.16,.18,.2])]);
const mat=()=>new THREE.MeshPhongMaterial({color:0xffffff,specular:0x383838,shininess:60,vertexColors:true});
const rnd=(()=>{let s=1;return()=>(s=(s*1664525+1013904223)>>>0)/4294967296;})();
const cars=[];for(let i=0;i<N;i++){const row=i%30,k=(i/30|0);cars.push({x:(row-15)*50+(rnd()<.5?-3:3),z:-600+k*12+rnd()*4,h:rnd()<.5?0:Math.PI,c:new THREE.Color().setHSL(rnd(),.5,.5)});}
const M=new THREE.Matrix4(),Q=new THREE.Quaternion(),V=new THREE.Vector3(),S=new THREE.Vector3(1,1,1),Y=new THREE.Vector3(0,1,0);
let update=()=>{};
if(MODE==='im2'){
  const m=new InstancedMesh2(hi,mat(),{capacity:N,renderer:R});
  m.addLOD(lo,mat(),120);
  m.addInstances(N,(o,i)=>{const c=cars[i];o.position.set(c.x,0,c.z);o.quaternion.setFromAxisAngle(Y,c.h);o.color=c.c;});
  m.computeBVH();scene.add(m);
}else if(MODE==='split'){
  // what the game does today (addParkedCars/split): two InstancedMeshes, rebuilt every 400 ms by distance, frustumCulled=false
  const near=new THREE.InstancedMesh(hi,mat(),N),far=new THREE.InstancedMesh(lo,mat(),N);
  for(const m of[near,far]){m.frustumCulled=false;scene.add(m);}
  const split=()=>{near.count=far.count=0;for(const c of cars){Q.setFromAxisAngle(Y,c.h);M.compose(V.set(c.x,0,c.z),Q,S);const m=(c.x-cam.position.x)**2+(c.z-cam.position.z)**2<14400?near:far;const i=m.count++;m.setMatrixAt(i,M);m.setColorAt(i,c.c);}
    for(const m of[near,far]){m.instanceMatrix.needsUpdate=true;m.instanceColor.needsUpdate=true;}};
  split();setInterval(split,400);
}else{
  const m=new THREE.InstancedMesh(hi,mat(),N);m.frustumCulled=false;
  cars.forEach((c,i)=>{Q.setFromAxisAngle(Y,c.h);M.compose(V.set(c.x,0,c.z),Q,S);m.setMatrixAt(i,M);m.setColorAt(i,c.c);});scene.add(m);
}
let frames=0,cpu=0,t0=performance.now(),calls=0,tris=0;
function loop(){const a=performance.now();R.render(scene,cam);R.getContext().finish();cpu+=performance.now()-a;frames++;calls=R.info.render.calls;tris=R.info.render.triangles;
  if(performance.now()-t0>3000){window.__stats={mode:MODE,renderMsFinish:+(cpu/frames).toFixed(2),calls,tris};}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
