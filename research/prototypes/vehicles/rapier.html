<!doctype html><meta charset="utf-8"><title>Rapier raycast vehicle prototype</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#9db7d0;font:13px system-ui}#h{position:fixed;left:8px;top:6px;color:#111}</style>
<div id="h">W/S throttle, A/D steer, Space handbrake, R reset. Rapier DynamicRayCastVehicleController on a flat plane.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js","rapier":"https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.14.0/rapier.es.js"}}</script>
<script type="module">
import * as THREE from 'three';
import RAPIER from 'rapier';
await RAPIER.init();
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9db7d0);
const cam=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,500);
const r=new THREE.WebGLRenderer({antialias:true});r.setSize(innerWidth,innerHeight);document.body.appendChild(r.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x556655,1.4));const sun=new THREE.DirectionalLight(0xffffff,1.6);sun.position.set(30,50,20);scene.add(sun);
const world=new RAPIER.World({x:0,y:-9.81,z:0});
const box=(sx,sy,sz,x,y,z,dyn,col)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(sx*2,sy*2,sz*2),new THREE.MeshLambertMaterial({color:col}));scene.add(m);
  const b=world.createRigidBody((dyn?RAPIER.RigidBodyDesc.dynamic():RAPIER.RigidBodyDesc.fixed()).setTranslation(x,y,z));world.createCollider(RAPIER.ColliderDesc.cuboid(sx,sy,sz).setFriction(.8),b);return{m,b};};
box(200,.1,200,0,-.1,0,false,0x6b8f5e);
const props=[];for(let i=0;i<14;i++)props.push(box(.5,.5,.5,8+Math.random()*30-15,.5+i*1.1,-20-i*3,true,0xc9a23a));
box(8,2,.5,0,2,-60,false,0x888888);box(3,.15,6,12,.1,-10,false,0x777777);
const body=world.createRigidBody(RAPIER.RigidBodyDesc.dynamic().setTranslation(0,2,0).setCanSleep(false));
world.createCollider(RAPIER.ColliderDesc.cuboid(.85,.35,2.1).setMass(1100),body);
const chassis=new THREE.Mesh(new THREE.BoxGeometry(1.7,.7,4.2),new THREE.MeshLambertMaterial({color:0x74767a}));scene.add(chassis);
const vc=world.createVehicleController(body);vc.indexUpAxis=1;vc.setIndexForwardAxis=2;
const W=[[-.8,-.1,1.3],[.8,-.1,1.3],[-.8,-.1,-1.3],[.8,-.1,-1.3]],wm=[];
for(const [x,y,z] of W){vc.addWheel({x,y,z},{x:0,y:-1,z:0},{x:-1,y:0,z:0},.3,.34);
  const i=wm.length;vc.setWheelSuspensionStiffness(i,30);vc.setWheelMaxSuspensionTravel(i,.3);vc.setWheelFrictionSlip(i,1.6);vc.setWheelSideFrictionStiffness(i,1);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(.34,.34,.26,16).rotateZ(Math.PI/2),new THREE.MeshLambertMaterial({color:0x222}));scene.add(m);wm.push(m);}
const K={};addEventListener('keydown',e=>K[e.code]=true);addEventListener('keyup',e=>K[e.code]=false);
let steer=0;const cp=new THREE.Vector3();
const loop=()=>{requestAnimationFrame(loop);
  if(K.KeyR){body.setTranslation({x:0,y:2,z:0},true);body.setRotation({x:0,y:0,z:0,w:1},true);body.setLinvel({x:0,y:0,z:0},true);body.setAngvel({x:0,y:0,z:0},true);}
  const f=((K.KeyW?1:0)-(K.KeyS?1:0)),st=((K.KeyA?1:0)-(K.KeyD?1:0));steer+=(st*.5-steer)*.15;
  for(let i=0;i<4;i++){vc.setWheelEngineForce(i,-f*500);vc.setWheelBrake(i,K.Space?2.5:0);vc.setWheelFrictionSlip(i,K.Space&&i>1?.5:1.6);}
  vc.setWheelSteering(0,steer);vc.setWheelSteering(1,steer);
  vc.updateVehicle(1/60);world.timestep=1/60;world.step();
  const t=body.translation(),q=body.rotation();chassis.position.set(t.x,t.y,t.z);chassis.quaternion.set(q.x,q.y,q.z,q.w);
  for(let i=0;i<4;i++){const s=vc.wheelSuspensionLength(i)||0;
    const l=new THREE.Vector3(W[i][0],W[i][1]-s,W[i][2]).applyQuaternion(chassis.quaternion).add(chassis.position);wm[i].position.copy(l);wm[i].quaternion.copy(chassis.quaternion);wm[i].rotateY(i<2?steer:0);}
  for(const p of props){const a=p.b.translation(),b=p.b.rotation();p.m.position.set(a.x,a.y,a.z);p.m.quaternion.set(b.x,b.y,b.z,b.w);}
  const fw=new THREE.Vector3(0,0,1).applyQuaternion(chassis.quaternion);fw.y=0;fw.normalize();
  cp.lerp(new THREE.Vector3(t.x-fw.x*8,t.y+3.5,t.z-fw.z*8),.1);cam.position.copy(cp);cam.lookAt(t.x,t.y+1,t.z);r.render(scene,cam);window.__rap={speed:Math.hypot(body.linvel().x,body.linvel().z)};};
loop();
</script>
